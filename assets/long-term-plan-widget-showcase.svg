<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Long-Term Plan Widget project showcase</title>
  <desc id="desc">A light blue and mint project card for a local-first Windows desktop planner with JSON storage, edge docking, themes and optional local voice input.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fdff"/>
      <stop offset="0.58" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#effcf7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.52" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#6689a3" stroke-opacity="0.075"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5e8294" flood-opacity="0.17"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="390" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <circle cx="1120" cy="42" r="220" fill="#38bdf8" fill-opacity=".08"/>
    <circle cx="970" cy="410" r="280" fill="#34d399" fill-opacity=".08"/>

    <g transform="translate(62 48)">
      <rect width="184" height="32" rx="16" fill="#0891b2" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".48"/>
      <circle cx="17" cy="16" r="4" fill="#06b6d4"/>
      <text x="30" y="21" fill="#0e7490" font-size="12" font-weight="700" letter-spacing="1.35">NEW OPEN SOURCE</text>

      <text y="100" fill="#17233d" font-size="42" font-weight="750" letter-spacing="-.7">Long-Term Plan Widget</text>
      <text y="136" fill="#586985" font-size="18">A compact, local-first desktop planner for Windows.</text>

      <g transform="translate(0 166)" font-size="13" font-weight="650">
        <g><rect width="76" height="30" rx="15" fill="#fff" stroke="#91a2bc" stroke-opacity=".52"/><text x="17" y="20" fill="#334155">Python</text></g>
        <g transform="translate(86)"><rect width="86" height="30" rx="15" fill="#fff" stroke="#91a2bc" stroke-opacity=".52"/><text x="17" y="20" fill="#334155">Tkinter</text></g>
        <g transform="translate(182)"><rect width="86" height="30" rx="15" fill="#fff" stroke="#91a2bc" stroke-opacity=".52"/><text x="17" y="20" fill="#334155">Windows</text></g>
        <g transform="translate(278)"><rect width="60" height="30" rx="15" fill="#fff" stroke="#91a2bc" stroke-opacity=".52"/><text x="18" y="20" fill="#334155">MIT</text></g>
      </g>

      <g transform="translate(0 230)" font-size="14">
        <g><circle cx="9" cy="-4" r="9" fill="#0891b2" fill-opacity=".13"/><path d="M5-4l3 3 6-7" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/><text x="28" fill="#26344d" font-weight="650">Plain JSON, atomic saves and automatic backup</text></g>
        <g transform="translate(0 42)"><circle cx="9" cy="-4" r="9" fill="#3b82f6" fill-opacity=".12"/><path d="M5-4l3 3 6-7" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/><text x="28" fill="#26344d" font-weight="650">Edge docking, auto-hide and three visual themes</text></g>
        <g transform="translate(0 84)"><circle cx="9" cy="-4" r="9" fill="#10b981" fill-opacity=".13"/><path d="M5-4l3 3 6-7" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/><text x="28" fill="#26344d" font-weight="650">Optional local Chinese speech recognition</text></g>
      </g>
    </g>

    <g transform="translate(748 32)" filter="url(#shadow)" font-family="Inter,Microsoft YaHei,Segoe UI,sans-serif">
      <rect width="380" height="326" rx="22" fill="#ffffff" stroke="#8aa8b7" stroke-opacity=".5"/>
      <rect width="380" height="8" rx="4" fill="url(#accent)"/>
      <text x="26" y="52" fill="#102033" font-size="24" font-weight="750">长期计划表</text>
      <text x="26" y="77" fill="#64748b" font-size="12">2 active · 1 complete · local only</text>
      <circle cx="314" cy="47" r="16" fill="#e0f2fe"/><text x="314" y="53" text-anchor="middle" fill="#0369a1" font-size="18">＋</text>
      <circle cx="348" cy="47" r="16" fill="#dcfce7"/><circle cx="348" cy="47" r="5" fill="#10b981"/>

      <text x="26" y="112" fill="#334155" font-size="13" font-weight="700">计划中</text>
      <g transform="translate(22 127)">
        <rect width="336" height="69" rx="10" fill="#eaf4f7"/><rect width="5" height="69" rx="3" fill="#1f6f8b"/>
        <text x="18" y="28" fill="#102033" font-size="15" font-weight="700">整理本周计划</text>
        <text x="18" y="51" fill="#526579" font-size="11">拆成清晰、可以完成的小步骤</text>
        <rect x="299" y="17" width="18" height="18" rx="4" fill="none" stroke="#1f6f8b" stroke-width="2"/>
      </g>
      <g transform="translate(22 206)">
        <rect width="336" height="69" rx="10" fill="#eaf4f7"/><rect width="5" height="69" rx="3" fill="#1f6f8b"/>
        <text x="18" y="28" fill="#102033" font-size="15" font-weight="700">复查项目文档</text>
        <text x="18" y="51" fill="#526579" font-size="11">补充安装方式和隐私说明</text>
        <rect x="299" y="17" width="18" height="18" rx="4" fill="none" stroke="#1f6f8b" stroke-width="2"/>
      </g>
      <g transform="translate(22 286)">
        <rect width="336" height="25" rx="8" fill="#ecf6f0"/><rect width="5" height="25" rx="3" fill="#4a866c"/>
        <text x="18" y="18" fill="#365c49" font-size="12">完成开源说明</text>
        <path d="M307 12l4 4 7-9" fill="none" stroke="#337357" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <rect y="384" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>
