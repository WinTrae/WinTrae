<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Codex Node Guardian project showcase</title>
  <desc id="desc">A polished dark technology card presenting WinTrae's privacy-safe Windows node health monitor, its workflow, safety features, and offline test coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="0.58" stop-color="#f3f6ff"/>
      <stop offset="1" stop-color="#ebfbff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7286aa" stroke-opacity="0.09"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#667fa8" flood-opacity="0.16"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="520" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="520" fill="url(#bg)"/>
    <rect width="1200" height="520" fill="url(#grid)"/>
    <circle cx="65" cy="120" r="330" fill="url(#violetGlow)"/>
    <circle cx="1130" cy="430" r="360" fill="url(#cyanGlow)"/>

    <g transform="translate(62 54)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <g>
        <rect width="150" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
        <circle cx="17" cy="16" r="4" fill="#a78bfa"/>
        <text x="30" y="21" fill="#6d28d9" font-size="12" font-weight="700" letter-spacing="1.4">SELECTED WORK</text>
      </g>

      <text y="88" fill="#17233d" font-size="43" font-weight="750" letter-spacing="-0.8">Codex Node Guardian</text>
      <text y="123" fill="#586985" font-size="18">A cautious node health monitor and failover guardian</text>
      <text y="150" fill="#586985" font-size="18">for Windows, Clash and Mihomo.</text>

      <g transform="translate(0 181)" font-size="13" font-weight="650">
        <g><rect width="76" height="30" rx="15" fill="#ffffff" stroke="#91a2bc" stroke-opacity="0.55"/><text x="17" y="20" fill="#334155">Python</text></g>
        <g transform="translate(86)"><rect width="102" height="30" rx="15" fill="#ffffff" stroke="#91a2bc" stroke-opacity="0.55"/><text x="15" y="20" fill="#334155">PowerShell</text></g>
        <g transform="translate(198)"><rect width="86" height="30" rx="15" fill="#ffffff" stroke="#91a2bc" stroke-opacity="0.55"/><text x="17" y="20" fill="#334155">Windows</text></g>
      </g>

      <g transform="translate(0 245)" font-size="15">
        <g transform="translate(0 0)">
          <circle cx="10" cy="-5" r="10" fill="#22d3ee" fill-opacity="0.13" stroke="#22d3ee" stroke-opacity="0.55"/>
          <path d="M6-5l3 3 6-7" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="31" fill="#26344d" font-weight="650">Fast health checks</text>
          <text x="31" y="22" fill="#64748b" font-size="13">Measure availability, latency and stability.</text>
        </g>
        <g transform="translate(0 65)">
          <circle cx="10" cy="-5" r="10" fill="#8b5cf6" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/>
          <path d="M6-5l3 3 6-7" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="31" fill="#26344d" font-weight="650">History-aware decisions</text>
          <text x="31" y="22" fill="#64748b" font-size="13">Use success rate, P95 latency and jitter.</text>
        </g>
        <g transform="translate(0 130)">
          <circle cx="10" cy="-5" r="10" fill="#3b82f6" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.55"/>
          <path d="M6-5l3 3 6-7" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="31" fill="#26344d" font-weight="650">Controlled recovery</text>
          <text x="31" y="22" fill="#64748b" font-size="13">Dry-run first, switch only when justified.</text>
        </g>
      </g>
    </g>

    <g transform="translate(627 52)" filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect width="510" height="410" rx="23" fill="url(#panel)" stroke="#91a2bc" stroke-opacity="0.5"/>
      <rect width="510" height="48" rx="23" fill="#eef2ff"/>
      <path d="M0 27H510V48H0Z" fill="#eef2ff"/>
      <circle cx="24" cy="24" r="5" fill="#fb7185"/>
      <circle cx="42" cy="24" r="5" fill="#fbbf24"/>
      <circle cx="60" cy="24" r="5" fill="#34d399"/>
      <text x="82" y="29" fill="#657795" font-family="Consolas,monospace" font-size="12">guardian / live decision</text>
      <g transform="translate(24 70)">
        <rect width="462" height="78" rx="15" fill="#f8fbff" stroke="#22d3ee" stroke-opacity="0.32"/>
        <g transform="translate(22 20)">
          <circle cx="19" cy="19" r="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.55"/>
          <circle cx="19" cy="19" r="6" fill="#22d3ee" filter="url(#softGlow)"/>
          <text x="50" y="14" fill="#26344d" font-size="14" font-weight="700">CURRENT NODE</text>
          <text x="50" y="35" fill="#0e7490" font-size="13" font-family="Consolas,monospace">healthy · protected · monitored</text>
          <rect x="337" y="4" width="76" height="28" rx="14" fill="#10b981" fill-opacity="0.13" stroke="#34d399" stroke-opacity="0.4"/>
          <text x="357" y="23" fill="#15803d" font-size="12" font-weight="700">STABLE</text>
        </g>
      </g>

      <g transform="translate(24 168)">
        <text fill="#657795" font-size="11" font-weight="700" letter-spacing="1.4">DECISION PIPELINE</text>
        <g transform="translate(0 24)" font-size="12" font-weight="700">
          <g><rect width="88" height="44" rx="11" fill="#f5f0ff" stroke="#a78bfa" stroke-opacity="0.6"/><text x="26" y="27" fill="#6d28d9">PROBE</text></g>
          <path d="M96 22H115" stroke="#596b88" stroke-width="2"/><path d="M110 17l6 5-6 5" fill="none" stroke="#596b88" stroke-width="2"/>
          <g transform="translate(124)"><rect width="88" height="44" rx="11" fill="#eef5ff" stroke="#60a5fa" stroke-opacity="0.6"/><text x="26" y="27" fill="#1d4ed8">SCORE</text></g>
          <path d="M220 22H239" stroke="#596b88" stroke-width="2"/><path d="M234 17l6 5-6 5" fill="none" stroke="#596b88" stroke-width="2"/>
          <g transform="translate(248)"><rect width="88" height="44" rx="11" fill="#edfbff" stroke="#22d3ee" stroke-opacity="0.6"/><text x="21" y="27" fill="#0e7490">DECIDE</text></g>
          <path d="M344 22H363" stroke="#596b88" stroke-width="2"/><path d="M358 17l6 5-6 5" fill="none" stroke="#596b88" stroke-width="2"/>
          <g transform="translate(372)"><rect width="90" height="44" rx="11" fill="#effcf7" stroke="#34d399" stroke-opacity="0.6"/><text x="16" y="27" fill="#15803d">RECOVER</text></g>
        </g>
      </g>

      <g transform="translate(24 270)">
        <text fill="#657795" font-size="11" font-weight="700" letter-spacing="1.4">VERIFIED SAFEGUARDS</text>
        <g transform="translate(0 23)">
          <g>
            <rect width="142" height="88" rx="14" fill="#f8faff" stroke="#91a2bc" stroke-opacity="0.42"/>
            <text x="16" y="34" fill="#17233d" font-size="27" font-weight="750">56</text>
            <text x="16" y="60" fill="#64748b" font-size="12">OFFLINE TESTS</text>
            <rect x="16" y="72" width="72" height="3" rx="1.5" fill="#8b5cf6"/>
          </g>
          <g transform="translate(160)">
            <rect width="142" height="88" rx="14" fill="#f8faff" stroke="#91a2bc" stroke-opacity="0.42"/>
            <text x="16" y="34" fill="#17233d" font-size="18" font-weight="750">DRY-RUN</text>
            <text x="16" y="60" fill="#64748b" font-size="12">SAFE BY DEFAULT</text>
            <rect x="16" y="72" width="82" height="3" rx="1.5" fill="#3b82f6"/>
          </g>
          <g transform="translate(320)">
            <rect width="142" height="88" rx="14" fill="#f8faff" stroke="#91a2bc" stroke-opacity="0.42"/>
            <text x="16" y="34" fill="#17233d" font-size="18" font-weight="750">SOURCE</text>
            <text x="16" y="60" fill="#64748b" font-size="12">DATA STAYS LOCAL</text>
            <rect x="16" y="72" width="92" height="3" rx="1.5" fill="#22d3ee"/>
          </g>
        </g>
      </g>
    </g>

    <rect y="514" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>
